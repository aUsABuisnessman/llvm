name: Labeling new issues
on:
  issues:
    types: ['opened']

permissions:
  contents: read

jobs:
  automate-issues-labels:
    permissions:
      issues: write
    runs-on: ubuntu-24.04
    if: github.repository == 'llvm/llvm-project'
    steps:
      - uses: llvm/actions/issue-labeler@main
        with:
          repo-token: ${{ secrets.ISSUE_SUBSCRIBER_TOKEN }}
          configuration-path: .github/new-issues-labeler.yml
          include-title: 1
          include-body: 0
          sync-labels: 0
          enable-versioned-regex: 0

version: 2
updates:
  # 1. Go - highest priority, most frequent updates
  - package-ecosystem: "gomod"
    directory: "/"                # Location of go.mod file
    schedule:
      interval: "daily"           # Most frequent
    open-pull-requests-limit: 10

  # 2. Python - less frequent
  - package-ecosystem: "pip"
    directory: "/"                # Location of requirements.txt or Pipfile
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2

  # 3. GitHub Actions - even less frequent
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  # 4. NPM, Maven, etc. - add more as needed, with lower frequency or limits
